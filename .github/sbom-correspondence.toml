# ============================================================
# .github/sbom-correspondence.toml
# ============================================================
# REQ: Correspondence evidence must be independent of the PURL under test.
# REQ: An authorized match must be unique in both directions.
# WHY: A target record claimed by two source records cannot establish
#      individual correspondence for either source occurrence.
# OBS: PURL comparison uses exact recorded strings within each matched pair.
# OBS: Source coverage includes package records carrying at least one PURL.
#      Target candidates include package records with zero PURLs when they carry
#      policy evidence. Target records without evidence are counted separately
#      as unkeyed because they cannot be matched.
# ============================================================

# ============================================================
# === POLICY 1: USE PACKAGE HASH (3 ALGORITHMS) ===
# ============================================================

[[policy]]
id = "package-hash"
method = "shared-package-digest"
algorithms = ["SHA-1", "SHA-256", "SHA-512"]

# ============================================================
# === POLICY 2: USE NAME AND VERSION (NO ECOSYSTEM EVIDENCE) ===
# ============================================================

# WHY: Uses only fields every SBOM format records natively, so a converter
#      is not penalized for dropping producer-specific annotations.
[[policy]]
id = "name-version"
method = "exact-fields"
fields = ["name", "version"]

# ============================================================
# === POLICY 3: USE ECOSYSTEM, NAME, VERSION ===
# ============================================================

[[policy]]
id = "ecosystem-name-version"
method = "exact-fields"
fields = ["ecosystem", "name", "version"]

# ============================================================
# === POLICY 4: USE NAME, VERSION, DECLARING FILE ===
# ============================================================

# OBS: Added after the first inspection run showed repeated name and version
#      pairs from different workflow files. Exploratory, not a frozen policy.
# WHY: The declaring file is evidence independent of the PURL under test.
[[policy]]
id = "name-version-declared-in"
method = "exact-fields"
fields = ["name", "version", "declared_in"]

# ============================================================
# === ECOSYSTEM EVIDENCE RULES ===
# ============================================================

# WHY: A CycloneDX property can explicitly identify the package ecosystem.
#      Only declared values participate in the correspondence policy.
[[ecosystem_rule]]
format = "cdx"
property = "syft:package:type"
equals = "github-action"
ecosystem = "github-actions"

[[ecosystem_rule]]
format = "cdx"
property = "syft:package:type"
equals = "npm"
ecosystem = "npm"

# WHY: The observed Syft SPDX sourceInfo explicitly identifies this cataloger.
#      A missing or unrecognized declaration leaves the ecosystem unknown.
[[ecosystem_rule]]
format = "spdx"
field = "sourceInfo"
starts_with = "acquired package info from GitHub Actions workflow file or composite action file:"
ecosystem = "github-actions"

# WHY: Observed Syft SPDX label for npm lockfile entries. It names the
#      cataloger's source file, not the ecosystem, so it is a declared heuristic.
[[ecosystem_rule]]
format = "spdx"
field = "sourceInfo"
starts_with = "acquired package info from installed node module manifest file:"
ecosystem = "npm"

# ============================================================
# === DECLARING FILE EVIDENCE RULES ===
# ============================================================

# WHY: Syft records where it found each package. Leading slashes are removed
#      so the CycloneDX and SPDX paths compare equal. Only the first location
#      is read. A missing or conflicting declaration leaves the file unknown.
[[declared_in_rule]]
format = "cdx"
property = "syft:location:0:path"

[[declared_in_rule]]
format = "spdx"
field = "sourceInfo"
after = "file: "
