# ============================================================
# .github/workflows/release-vs-code-extension.yml
# ============================================================
# Updated: 2026-06-06
#
# REQ: VS Code extension repositories SHOULD provide a reproducible package workflow.
# WHY: Build and archive the VSIX release candidate from a clean GitHub Actions environment.
# OBS: Marketplace publishing is intentionally manual until VSCE_PAT automation is configured.
# CUSTOM: Add automated Marketplace publishing only after the publisher PAT flow is working.

name: Release VS Code Extension

# === Workflow triggers ===

on:
  workflow_dispatch: # WHY: Manual package candidate creation.
  push:
    branches: [main]
    tags:
      - "v*" # WHY: Package release candidates for version tags.

# === Concurrency ===

concurrency:
  group: release-vscode-extension-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# === Permissions ===

permissions:
  contents: read

# === Jobs ===

jobs:
  package:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # === Assemble: Checkout ===

      - name: A1) Checkout repository code
        uses: actions/checkout@v6

      # === Assemble: Node setup ===

      - name: A2) Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      # === Assemble: Install ===

      - name: A3) Install dependencies
        run: npm ci

      # === Baseline Checks ===

      - name: B1) Run project checks
        run: xvfb-run -a npm run check

      # === Candidate: Package ===

      - name: C1) Package VSIX
        run: npm run package:vsix

      # === Candidate: Inspect ===

      - name: C2) List VSIX contents
        run: npx @vscode/vsce ls --tree

      # === Candidate: Artifact ===

      - name: C3) Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: comment-section-outline-vsix
          path: "*.vsix"
