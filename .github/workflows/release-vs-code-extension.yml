# ============================================================
# .github/workflows/release-vs-code-extension.yml
# ============================================================
# Updated: 2026-06-06
#
# REQ: VS Code extension repositories SHOULD provide a reproducible release workflow.
# WHY: Package and optionally publish the extension from a clean GitHub Actions environment.
# OBS: Publishing requires marketplace credentials stored as GitHub secrets.
# CUSTOM: Enable marketplace publishing only after publisher/token setup is complete.

name: Release VS Code Extension

# === Workflow triggers ===

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to VS Code Marketplace"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# === Permissions ===

permissions:
  contents: read

# === Jobs ===

jobs:
  package:
    name: Create release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # === Assemble: Checkout ===

      - name: A1) Checkout repository code
        uses: actions/checkout@v6

      # === Assemble: Node setup ===

      - name: A2) Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      # === Assemble: Install ===

      - name: A3) Install dependencies
        run: npm ci

      # === Baseline Checks ===

      - name: B1) Run project checks
        run: xvfb-run -a npm run check

      # === Candidate: Package ===

      - name: C1) Package extension
        run: npx @vscode/vsce package

      # === Candidate: Artifact ===

      - name: C2) Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"

      # === Deploy and publish ===

      - name: D1) Publish extension
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
